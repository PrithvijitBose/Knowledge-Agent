name: Knowledge AI Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  knowledge_bot:
    if: (contains(github.event.comment.body, '@Knowledge') || contains(github.event.comment.body, '@knowledge') || contains(github.event.comment.body, '/knowledge') || contains(github.event.comment.body, '/Knowledge')) && github.event.comment.user.type != 'Bot'
    if: (contains(github.event.comment.body, '@Knowledge') || contains(github.event.comment.body, '@knowledge')) && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install httpx python-dotenv

      - name: Run Knowledge Bot
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: 'mistral-small-2506'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python knowledge_engine.py \
            --owner "$REPO_OWNER" \
            --repo "$REPO_NAME" \
            --issue "$ISSUE_NUMBER" \
            --comment "$COMMENT_BODY" \
            --author "$COMMENT_AUTHOR"
