name: Knowledge AI Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  knowledge_bot:
    if: (contains(github.event.comment.body, '@Knowledge') || contains(github.event.comment.body, '@knowledge') || contains(github.event.comment.body, '/knowledge') || contains(github.event.comment.body, '/Knowledge')) && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install httpx python-dotenv

      # Persistent repository memory (#6): the runner's filesystem is thrown
      # away after every job, so restore whatever the most recent previous
      # run saved. Keyed by run_id + run_attempt (not a fixed key) + save
      # unconditionally below, because actions/cache skips the save step on
      # an exact key match -- a fixed key would restore fine but never
      # actually update. run_attempt matters too: a manual rerun keeps the
      # same run_id, so without it a rerun would hit its own previous
      # attempt's now-immutable cache entry and never save updated memory.
      - name: Restore Knowledge memory cache
        uses: actions/cache/restore@v4
        with:
          path: .knowledge
          key: knowledge-memory-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            knowledge-memory-${{ github.repository }}-

      - name: Run Knowledge Bot
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: 'mistral-small-2506'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOWLEDGE_MEMORY_PATH: .knowledge/memory.json
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          python knowledge_engine.py \
            --owner "$REPO_OWNER" \
            --repo "$REPO_NAME" \
            --issue "$ISSUE_NUMBER" \
            --comment "$COMMENT_BODY" \
            --author "$COMMENT_AUTHOR"

      - name: Save Knowledge memory cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .knowledge
          key: knowledge-memory-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
