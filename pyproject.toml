[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-agent"
version = "0.3.1"
description = "Engineering Context Layer & Native GitHub Bot for Issues and Pull Requests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Poorvith M P" }
]
dependencies = [
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
knowledge-agent = "knowledge_agent.__main__:main"
knowledge = "knowledge_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_agent*"]
